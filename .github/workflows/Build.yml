
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      # 1. دریافت سورس پروژه
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. نصب Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. بررسی Android SDK
      - name: Check Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK not found!"
            exit 1
          fi

          ls -la "$ANDROID_HOME"

      # 4. پیدا کردن SDK Manager
      - name: Locate SDK Manager
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found!"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Found SDK Manager:"
          echo "$SDKMANAGER"

      # 5. پذیرش مجوزهای Android SDK
      - name: Accept Android Licenses
        shell: bash
        run: |
          bash "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses < <(yes)

      # 6. نصب ابزارهای موردنیاز Android
      - name: Install Android SDK Components
        shell: bash
        run: |
          bash "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 7. بررسی نصب SDK
      - name: Verify Android SDK
        shell: bash
        run: |
          echo "Installed platforms:"
          ls "$ANDROID_HOME/platforms"

          echo "Installed build tools:"
          ls "$ANDROID_HOME/build-tools"

      # 8. نصب Gradle 8.7
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 9. بررسی ساختار پروژه
      - name: Check Project Files
        shell: bash
        run: |
          echo "Project directory:"
          ls -la

          if [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts not found!"
            exit 1
          fi

          if [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts not found!"
            exit 1
          fi

      # 10. ساخت APK
      - name: Build Debug APK
        shell: bash
        run: |
          gradle assembleDebug --stacktrace

      # 11. بررسی خروجی APK
      - name: Verify APK
        shell: bash
        run: |
          echo "Searching for APK files..."

          find app/build/outputs/apk -type f -name "*.apk"

          if ! ls app/build/outputs/apk/debug/*.apk >/dev/null 2>&1; then
            echo "ERROR: APK file was not generated!"
            exit 1
          fi

      # 12. دریافت فایل APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: How-to-Become-Bach-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
