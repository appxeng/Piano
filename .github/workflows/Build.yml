
name: Build How to Become Bach APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          ZIP_FILE="How_to_Become_Bach_Android_Project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          unzip -t "$ZIP_FILE"

          mkdir -p "$RUNNER_TEMP/android-source"

          unzip -oq "$ZIP_FILE" -d "$RUNNER_TEMP/android-source"

          echo "Searching for Android project..."

          PROJECT_FILE=$(find "$RUNNER_TEMP/android-source" \
            -type f \
            -path "*/HowToBecomeBach/settings.gradle.kts" \
            | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Android project not found"
            find "$RUNNER_TEMP/android-source" -maxdepth 7 -type f
            exit 1
          fi

          PROJECT_DIR="${PROJECT_FILE%/settings.gradle.kts}"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found:"
          echo "$PROJECT_DIR"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check project configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Java version:"
          java -version

          echo "Gradle version:"
          gradle --version

          echo "Project directory:"
          pwd

          echo "Checking JVM targets:"
          grep -n -E "sourceCompatibility|targetCompatibility|jvmTarget" app/build.gradle.kts

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: How-to-Become-Bach-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload error log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Build-Error-Log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: warn
          retention-days: 7
